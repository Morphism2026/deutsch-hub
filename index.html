<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#12100e">
<title>Deutsch Hub · Aki</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DEUTSCH HUB — Design tokens
   Palette: "Bauhaus warm" — ink, bone, signal-red, cobalt, ochre
   ============================================================ */
:root {
  --bg: #14110f;
  --bg-elevated: #1d1916;
  --bg-card: #221d19;
  --bg-hover: #2b2521;
  --border: #342d27;
  --border-strong: #443b33;
  --text: #f2ece3;
  --text-muted: #a99e90;
  --text-dim: #776d61;
  --accent: #e0533d;          /* signal red-orange */
  --accent-hover: #ec6450;
  --accent-soft: rgba(224, 83, 61, 0.14);
  --red: #e0533d; --red-soft: rgba(224, 83, 61, 0.14);
  --cobalt: #4b7bd4;
  --cobalt-soft: rgba(75, 123, 212, 0.16);
  --ochre: #d99a2b;
  --ochre-soft: rgba(217, 154, 43, 0.16);
  --green: #6fae6a;
  --green-soft: rgba(111, 174, 106, 0.16);
  --danger: #d0453f;
  --danger-soft: rgba(208, 69, 63, 0.16);
  --radius: 14px;
  --radius-lg: 20px;
  --radius-sm: 9px;
  --shadow: 0 8px 30px rgba(0,0,0,0.35);
  --shadow-sm: 0 2px 10px rgba(0,0,0,0.2);
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
  --mono: 'JetBrains Mono', monospace;
}
[data-theme="light"] {
  --bg: #f4efe6;
  --bg-elevated: #fdfbf6;
  --bg-card: #ffffff;
  --bg-hover: #f0e9db;
  --border: #e3daca;
  --border-strong: #cbbfa9;
  --text: #211c17;
  --text-muted: #6a6154;
  --text-dim: #94897a;
  --accent: #cf4326;
  --accent-hover: #b8371d;
  --accent-soft: rgba(207, 67, 38, 0.10);
  --red: #cf4326; --red-soft: rgba(207, 67, 38, 0.10);
  --cobalt: #315fb0;
  --cobalt-soft: rgba(49, 95, 176, 0.10);
  --ochre: #b47c10;
  --ochre-soft: rgba(180, 124, 16, 0.12);
  --green: #4f8a4a;
  --green-soft: rgba(79, 138, 74, 0.12);
  --shadow: 0 8px 30px rgba(80,60,30,0.10);
  --shadow-sm: 0 2px 10px rgba(80,60,30,0.06);
}
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  transition: background 0.4s, color 0.4s;
  overflow-x: hidden;
}

/* ============ TOP BAR ============ */
.top-bar {
  position: sticky; top: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg-elevated) 88%, transparent);
  border-bottom: 1px solid var(--border);
  padding: 13px 18px;
  display: flex; align-items: center; justify-content: space-between;
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
}
.logo { display: flex; align-items: center; gap: 11px; font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
.logo-mark {
  width: 34px; height: 34px; border-radius: 9px;
  background: var(--accent); color: #fff;
  display: grid; place-items: center;
  font-family: var(--serif); font-weight: 600; font-size: 19px;
  position: relative; overflow: hidden;
}
.logo-mark::after {
  content: ''; position: absolute; right: -6px; bottom: -6px;
  width: 16px; height: 16px; background: var(--cobalt); border-radius: 3px;
}
.logo-text small { display: block; font-size: 10px; color: var(--text-dim); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; margin-top: -2px; }
.top-actions { display: flex; gap: 8px; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 10px;
  border: 1px solid var(--border); background: transparent; color: var(--text);
  cursor: pointer; display: grid; place-items: center; font-size: 16px;
  transition: all 0.15s;
}
.icon-btn:hover { background: var(--bg-hover); border-color: var(--border-strong); }

/* ============ LAYOUT ============ */
.app { max-width: 940px; margin: 0 auto; padding-bottom: 92px; }
.container { padding: 22px 18px; }

/* ============ BOTTOM NAV ============ */
.bottom-nav {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 100;
  background: color-mix(in srgb, var(--bg-elevated) 92%, transparent);
  border-top: 1px solid var(--border);
  display: flex; padding: 7px 6px calc(7px + env(safe-area-inset-bottom));
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  max-width: 940px; margin: 0 auto;
}
.nav-btn {
  flex: 1; background: transparent; border: none; padding: 7px 4px 6px;
  color: var(--text-dim); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  font-size: 10.5px; font-family: inherit; font-weight: 500;
  transition: color 0.15s; position: relative; border-radius: 10px;
}
.nav-btn-icon { font-size: 19px; line-height: 1; transition: transform 0.2s; }
.nav-btn.active { color: var(--accent); }
.nav-btn.active .nav-btn-icon { transform: translateY(-1px) scale(1.08); }
.nav-btn.active::before {
  content: ''; position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 22px; height: 3px; background: var(--accent); border-radius: 3px;
}

/* ============ VIEWS ============ */
.view { display: none; animation: viewIn 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); }
.view.active { display: block; }
@keyframes viewIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ============ TYPOGRAPHY ============ */
h1 { font-family: var(--serif); font-size: 30px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.15; margin-bottom: 6px; }
h2 { font-family: var(--serif); font-size: 23px; font-weight: 600; letter-spacing: -0.01em; margin-bottom: 18px; }
h3 { font-size: 17px; font-weight: 600; margin-bottom: 11px; letter-spacing: -0.01em; }
h4 { font-size: 14px; font-weight: 600; margin-bottom: 7px; }
.eyebrow { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-bottom: 8px; }
.view-subtitle { color: var(--text-muted); font-size: 14.5px; margin-bottom: 26px; max-width: 60ch; }

/* ============ CARDS ============ */
.card {
  background: var(--bg-card); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 20px; margin-bottom: 15px;
  transition: border-color 0.15s, transform 0.15s;
}
.card-title { display: flex; align-items: center; gap: 11px; font-size: 15px; font-weight: 600; margin-bottom: 14px; }
.card-title-icon { width: 30px; height: 30px; border-radius: 9px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font-size: 15px; flex-shrink: 0; }

/* ============ HERO (home) ============ */
.hero {
  background: var(--bg-card);
  border: 1px solid var(--border); border-radius: var(--radius-lg);
  padding: 26px 24px; margin-bottom: 20px; position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; top: 0; right: 0; width: 180px; height: 180px;
  background: radial-gradient(circle at top right, var(--accent-soft), transparent 70%);
  pointer-events: none;
}
.hero-greeting { font-family: var(--serif); font-size: 32px; font-weight: 600; letter-spacing: -0.02em; line-height: 1.1; margin-bottom: 8px; }
.hero-greeting .wave { display: inline-block; animation: wave 2.5s ease-in-out infinite; transform-origin: 70% 70%; }
@keyframes wave { 0%,60%,100% { transform: rotate(0); } 10% { transform: rotate(14deg); } 20% { transform: rotate(-8deg); } 30% { transform: rotate(14deg); } 40% { transform: rotate(-4deg); } 50% { transform: rotate(10deg); } }
.hero-sub { color: var(--text-muted); font-size: 14.5px; position: relative; }

/* ============ STATS ============ */
.stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin-top: 20px; position: relative; }
.stat { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 13px 12px; text-align: left; }
.stat-value { font-family: var(--serif); font-size: 24px; font-weight: 600; line-height: 1; letter-spacing: -0.01em; }
.stat-label { font-size: 10.5px; color: var(--text-dim); margin-top: 5px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 500; }
@media (max-width: 520px) { .stats-row { grid-template-columns: repeat(2, 1fr); } }

/* ============ BUTTONS ============ */
.btn {
  padding: 11px 18px; border-radius: 10px; border: 1px solid var(--border-strong);
  background: transparent; color: var(--text); font-family: inherit;
  font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s;
  display: inline-flex; align-items: center; gap: 8px; justify-content: center;
}
.btn:hover { background: var(--bg-hover); border-color: var(--accent); }
.btn:active { transform: scale(0.98); }
.btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-full { width: 100%; }
.btn-sm { padding: 7px 12px; font-size: 12.5px; border-radius: 8px; }
.btn-ghost { border-color: transparent; }
.btn-ghost:hover { border-color: var(--border-strong); }

/* ============ QUICK ACTIONS ============ */
.quick-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.quick-tile {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 16px; cursor: pointer; transition: all 0.15s; text-align: left;
  display: flex; flex-direction: column; gap: 8px; font-family: inherit; color: var(--text);
}
.quick-tile:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.quick-tile-icon { width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; font-size: 18px; }
.qt-red { background: var(--accent-soft); color: var(--accent); }
.qt-blue { background: var(--cobalt-soft); color: var(--cobalt); }
.qt-ochre { background: var(--ochre-soft); color: var(--ochre); }
.qt-green { background: var(--green-soft); color: var(--green); }
.quick-tile-title { font-weight: 600; font-size: 14px; }
.quick-tile-desc { font-size: 12px; color: var(--text-muted); line-height: 1.4; }

/* ============ DICTIONARY SEARCH ============ */
.dict-hero {
  background: linear-gradient(135deg, var(--accent-soft), var(--cobalt-soft));
  border: 1px solid var(--border-strong); border-radius: var(--radius);
  padding: 18px; margin-bottom: 18px;
}
.dict-hero-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; display: flex; align-items: center; gap: 8px; }
.dict-hero-desc { font-size: 12.5px; color: var(--text-muted); margin-bottom: 14px; }
.dict-input {
  width: 100%; padding: 13px 16px; border-radius: 11px;
  border: 1px solid var(--border-strong); background: var(--bg);
  color: var(--text); font-family: inherit; font-size: 15px; margin-bottom: 10px;
}
.dict-input:focus { outline: none; border-color: var(--accent); }
.dict-btns { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.dict-btn {
  padding: 11px 8px; border-radius: 9px; border: 1px solid var(--border-strong);
  background: var(--bg-card); color: var(--text); cursor: pointer;
  font-family: inherit; font-size: 12.5px; font-weight: 600; transition: all 0.15s;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.dict-btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.dict-btn small { font-size: 10px; color: var(--text-dim); font-weight: 400; }
.dict-tip { background: var(--bg); border: 1px dashed var(--border-strong); border-radius: 9px; padding: 10px 12px; margin-top: 12px; font-size: 12px; color: var(--text-muted); }
.dict-tip strong { color: var(--text); }

/* ============ SESSION CARDS ============ */
.roadmap-line { position: relative; padding-left: 4px; }
.session-item {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 17px 18px; margin-bottom: 12px; cursor: pointer; transition: all 0.18s;
  position: relative; overflow: hidden;
}
.session-item::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
  background: var(--accent); opacity: 0; transition: opacity 0.18s;
}
.session-item:hover { border-color: var(--border-strong); transform: translateX(3px); }
.session-item:hover::before { opacity: 1; }
.session-item.locked { opacity: 0.6; cursor: default; }
.session-item.locked:hover { transform: none; border-color: var(--border); }
.session-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 7px; }
.session-daynum {
  font-family: var(--serif); font-size: 13px; font-weight: 600; color: var(--accent);
  display: flex; align-items: center; gap: 7px;
}
.session-daynum .dot { width: 5px; height: 5px; border-radius: 50%; background: var(--accent); }
.session-title { font-size: 16.5px; font-weight: 600; margin: 3px 0 6px; letter-spacing: -0.01em; }
.session-desc { font-size: 13px; color: var(--text-muted); margin-bottom: 11px; line-height: 1.5; }
.session-meta { display: flex; gap: 14px; font-size: 11.5px; color: var(--text-dim); flex-wrap: wrap; }
.session-meta span { display: flex; align-items: center; gap: 4px; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border-radius: 20px; font-size: 10.5px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; white-space: nowrap; }
.badge-done { background: var(--green-soft); color: var(--green); }
.badge-now { background: var(--ochre-soft); color: var(--ochre); }
.badge-soon { background: var(--bg-hover); color: var(--text-dim); }

/* ============ SESSION DETAIL ============ */
.back-btn { background: transparent; border: none; color: var(--accent); cursor: pointer; padding: 6px 0; font-size: 14px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; font-family: inherit; font-weight: 500; }
.detail-hero { margin-bottom: 22px; padding-bottom: 20px; border-bottom: 1px solid var(--border); }
.block { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 14px; }
.block-head { display: flex; align-items: center; gap: 12px; margin-bottom: 15px; }
.block-icon { width: 40px; height: 40px; border-radius: 11px; display: grid; place-items: center; font-size: 19px; flex-shrink: 0; background: var(--accent-soft); color: var(--accent); }
.block-icon.b-blue { background: var(--cobalt-soft); color: var(--cobalt); }
.block-icon.b-ochre { background: var(--ochre-soft); color: var(--ochre); }
.block-icon.b-green { background: var(--green-soft); color: var(--green); }
.block-title { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.block-sub { font-size: 12px; color: var(--text-muted); margin-top: 1px; }
.block-body { font-size: 14px; line-height: 1.75; }
.block-body p { margin-bottom: 12px; }
.block-body ul { margin: 10px 0 12px 2px; list-style: none; }
.block-body li { margin-bottom: 8px; padding-left: 20px; position: relative; }
.block-body li::before { content: '·'; position: absolute; left: 6px; color: var(--accent); font-weight: 700; font-size: 18px; line-height: 1.2; }
.block-body strong { color: var(--text); font-weight: 600; }
.block-body em { color: var(--accent); font-style: normal; font-weight: 500; }
.block-body code, .k {
  font-family: var(--mono); font-size: 13px; background: var(--bg);
  padding: 2px 7px; border-radius: 6px; color: var(--accent);
  border: 1px solid var(--border); white-space: nowrap;
}
.conj-table { width: 100%; border-collapse: collapse; margin: 14px 0; font-size: 14px; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
.conj-table td { padding: 9px 14px; border-bottom: 1px solid var(--border); }
.conj-table tr:last-child td { border-bottom: none; }
.conj-table td:first-child { color: var(--text-muted); width: 42%; }
.conj-table td:last-child { font-weight: 600; color: var(--accent); font-family: var(--mono); font-size: 13px; }
.conj-table tr:nth-child(even) { background: color-mix(in srgb, var(--bg-elevated) 50%, transparent); }
.callout { border-left: 3px solid var(--cobalt); background: var(--cobalt-soft); padding: 12px 14px; border-radius: 0 9px 9px 0; margin: 14px 0; font-size: 13.5px; }
.callout.warn { border-left-color: var(--ochre); background: var(--ochre-soft); }
.callout .callout-label { font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; margin-bottom: 4px; color: var(--cobalt); }
.callout.warn .callout-label { color: var(--ochre); }
.ex-pair { display: grid; grid-template-columns: 1fr; gap: 4px; padding: 11px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px; }
.ex-de { font-family: var(--mono); font-size: 13.5px; color: var(--text); }
.ex-es { font-size: 12.5px; color: var(--text-muted); }
.mini-drill { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 11px; padding: 15px; margin-top: 12px; }
.drill-q { font-size: 14px; margin-bottom: 10px; }
.drill-q .k { cursor: default; }
.reveal-btn { font-size: 12px; color: var(--cobalt); background: none; border: none; cursor: pointer; font-family: inherit; padding: 2px 0; font-weight: 500; }
.reveal-ans { display: none; margin-top: 6px; font-family: var(--mono); font-size: 13px; color: var(--green); }
.reveal-ans.show { display: block; }
.ep-card { display: flex; gap: 12px; align-items: center; padding: 12px 14px; background: var(--bg); border: 1px solid var(--border); border-radius: 11px; margin-bottom: 9px; text-decoration: none; color: var(--text); transition: all 0.15s; }
.ep-card:hover { border-color: var(--cobalt); background: var(--bg-hover); }
.ep-num { width: 32px; height: 32px; border-radius: 8px; background: var(--cobalt-soft); color: var(--cobalt); display: grid; place-items: center; font-weight: 600; font-size: 13px; font-family: var(--mono); flex-shrink: 0; }
.ep-info { flex: 1; min-width: 0; }
.ep-title { font-size: 13.5px; font-weight: 600; }
.ep-desc { font-size: 11.5px; color: var(--text-muted); }
.ep-arrow { color: var(--text-dim); font-size: 15px; }

/* ============ VOCAB ============ */
.vocab-controls { display: flex; gap: 8px; margin-bottom: 14px; }
.search-input { flex: 1; min-width: 0; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text); font-family: inherit; font-size: 14px; }
.search-input:focus { outline: none; border-color: var(--accent); }
.chips { display: flex; gap: 7px; margin-bottom: 16px; overflow-x: auto; padding-bottom: 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { padding: 7px 14px; border-radius: 20px; border: 1px solid var(--border); background: var(--bg-card); color: var(--text-muted); cursor: pointer; font-size: 12.5px; white-space: nowrap; transition: all 0.15s; font-family: inherit; font-weight: 500; display: flex; align-items: center; gap: 5px; }
.chip.active { background: var(--accent); color: #fff; border-color: var(--accent); }
.chip .chip-count { font-size: 10.5px; opacity: 0.7; }
.vocab-count { font-size: 12px; color: var(--text-dim); margin-bottom: 12px; }
.vocab-card { background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 16px; margin-bottom: 9px; transition: border-color 0.15s; }
.vocab-card:hover { border-color: var(--border-strong); }
.vocab-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; }
.vocab-de { font-size: 17px; font-weight: 600; display: flex; align-items: baseline; gap: 7px; flex-wrap: wrap; letter-spacing: -0.01em; }
.art { font-size: 12px; padding: 2px 8px; border-radius: 6px; font-weight: 600; font-family: var(--mono); }
.art-der { background: var(--cobalt-soft); color: var(--cobalt); }
.art-die { background: var(--accent-soft); color: var(--accent); }
.art-das { background: var(--green-soft); color: var(--green); }
.vocab-es { font-size: 13.5px; color: var(--text-muted); margin-top: 2px; }
.vocab-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 9px; }
.vtag { font-size: 11px; padding: 3px 9px; border-radius: 7px; background: var(--bg); border: 1px solid var(--border); color: var(--text-dim); }
.vtag strong { color: var(--text-muted); font-weight: 600; }
.vocab-ex { font-size: 12.5px; color: var(--text-muted); font-style: italic; margin-top: 9px; padding: 8px 12px; background: var(--bg); border-radius: 9px; border-left: 2px solid var(--accent); }
.vocab-ex .ex-tr { display: block; font-style: normal; color: var(--text-dim); font-size: 11.5px; margin-top: 2px; }
.vocab-actions { display: flex; gap: 6px; }
.vocab-badge { font-size: 9.5px; padding: 3px 8px; border-radius: 7px; background: var(--bg-hover); color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.04em; font-weight: 600; white-space: nowrap; height: fit-content; }

/* ============ FORMS ============ */
.form-group { margin-bottom: 15px; }
.form-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 6px; }
.form-input, .form-select, .form-textarea {
  width: 100%; padding: 11px 14px; border-radius: 10px; border: 1px solid var(--border);
  background: var(--bg-card); color: var(--text); font-family: inherit; font-size: 14px; transition: border-color 0.15s;
}
.form-input:focus, .form-select:focus, .form-textarea:focus { outline: none; border-color: var(--accent); }
.form-textarea { resize: vertical; min-height: 70px; }
.form-hint { font-size: 11.5px; color: var(--text-dim); margin-top: 5px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 11px; }
@media (max-width: 480px) { .form-row { grid-template-columns: 1fr; } }

/* ============ QUIZ ============ */
.quiz-mode-grid { display: grid; gap: 10px; }
.quiz-mode {
  background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 17px; cursor: pointer; transition: all 0.15s; text-align: left;
  display: flex; align-items: center; gap: 14px; font-family: inherit; color: var(--text);
}
.quiz-mode:hover { border-color: var(--accent); transform: translateY(-2px); box-shadow: var(--shadow-sm); }
.quiz-mode-icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; font-size: 21px; flex-shrink: 0; }
.quiz-mode-title { font-weight: 600; font-size: 15px; }
.quiz-mode-desc { font-size: 12.5px; color: var(--text-muted); }
.quiz-progress { display: flex; gap: 5px; margin-bottom: 22px; }
.qp-bar { flex: 1; height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
.qp-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.35s cubic-bezier(0.2,0.8,0.2,1); }
.quiz-counter { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; font-family: var(--mono); }
.quiz-q { font-size: 20px; font-weight: 600; margin-bottom: 22px; line-height: 1.4; font-family: var(--serif); letter-spacing: -0.01em; }
.quiz-q .k { font-size: 17px; }
.quiz-opt {
  display: block; width: 100%; padding: 15px 18px; border-radius: 12px;
  border: 1px solid var(--border); background: var(--bg-card); color: var(--text);
  cursor: pointer; text-align: left; font-family: inherit; font-size: 14.5px;
  margin-bottom: 9px; transition: all 0.14s; position: relative;
}
.quiz-opt:hover:not(:disabled) { border-color: var(--accent); background: var(--bg-hover); }
.quiz-opt:disabled { cursor: default; }
.quiz-opt.correct { border-color: var(--green); background: var(--green-soft); color: var(--green); font-weight: 500; }
.quiz-opt.wrong { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.quiz-opt .mark { position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 16px; }
.quiz-fb { padding: 14px 16px; border-radius: 11px; margin-top: 14px; font-size: 13.5px; display: none; line-height: 1.6; }
.quiz-fb.show { display: block; animation: viewIn 0.25s; }
.quiz-fb.correct { background: var(--green-soft); color: var(--green); border: 1px solid var(--green); }
.quiz-fb.wrong { background: var(--danger-soft); color: var(--danger); border: 1px solid var(--danger); }
.quiz-fb strong { display: block; margin-bottom: 3px; }
.result-ring { width: 120px; height: 120px; margin: 0 auto 18px; position: relative; }
.result-emoji { font-size: 54px; margin-bottom: 14px; }
.result-score { font-family: var(--serif); font-size: 38px; font-weight: 600; color: var(--accent); margin: 12px 0; }

/* ============ MODAL ============ */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 1000; align-items: flex-end; justify-content: center; backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px); }
.modal-overlay.active { display: flex; }
.modal { background: var(--bg-elevated); border: 1px solid var(--border); border-radius: 22px 22px 0 0; padding: 24px 22px calc(24px + env(safe-area-inset-bottom)); max-width: 520px; width: 100%; max-height: 92vh; overflow-y: auto; animation: sheetUp 0.3s cubic-bezier(0.2,0.9,0.3,1); }
@media (min-width: 560px) { .modal-overlay { align-items: center; } .modal { border-radius: 22px; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0.6; } to { transform: translateY(0); opacity: 1; } }
.modal-grip { width: 40px; height: 4px; background: var(--border-strong); border-radius: 3px; margin: -8px auto 16px; }
@media (min-width: 560px) { .modal-grip { display: none; } }
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
.modal-title { font-family: var(--serif); font-size: 20px; font-weight: 600; }
.modal-close { background: transparent; border: none; color: var(--text-muted); cursor: pointer; font-size: 24px; width: 34px; height: 34px; border-radius: 8px; display: grid; place-items: center; }
.modal-close:hover { background: var(--bg-hover); }
.modal-actions { display: flex; gap: 9px; margin-top: 20px; }

/* ============ MISC ============ */
.info-box { background: var(--cobalt-soft); border-left: 3px solid var(--cobalt); padding: 12px 14px; border-radius: 0 10px 10px 0; font-size: 12.5px; color: var(--text); margin-bottom: 16px; line-height: 1.55; }
.info-box strong { color: var(--cobalt); }
.empty { text-align: center; padding: 46px 20px; color: var(--text-muted); }
.empty-icon { font-size: 46px; margin-bottom: 12px; opacity: 0.4; }
.empty-text { font-size: 14px; margin-bottom: 18px; }
.toast { position: fixed; bottom: 104px; left: 50%; transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 12px 20px; border-radius: 12px; z-index: 2000; box-shadow: var(--shadow); font-size: 13.5px; font-weight: 500; opacity: 0; pointer-events: none; transition: all 0.3s cubic-bezier(0.2,0.9,0.3,1); }
.toast.active { opacity: 1; transform: translateX(-50%) translateY(0); }
.resource-btn { display: flex; align-items: center; gap: 11px; padding: 13px 15px; background: var(--bg-card); border: 1px solid var(--border); border-radius: 11px; cursor: pointer; transition: all 0.15s; font-family: inherit; color: var(--text); width: 100%; text-align: left; font-size: 13.5px; font-weight: 500; }
.resource-btn:hover { border-color: var(--accent); background: var(--bg-hover); }
.resource-btn .r-icon { font-size: 18px; }
.resource-btn .r-arrow { margin-left: auto; color: var(--text-dim); }
.section-label { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin: 22px 0 12px; }

@media (min-width: 640px) {
  .container { padding: 30px 24px; }
  h1 { font-size: 34px; }
  .hero-greeting { font-size: 38px; }
}

/* ============ SRS: STATUS DOTS + IPA ============ */
.status-dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:2px; flex-shrink:0; }
.sd-new { background:var(--text-dim); }
.sd-learning { background:var(--ochre); }
.sd-mastered { background:var(--green); }
.vocab-ipa { font-family:var(--mono); font-size:12px; color:var(--text-dim); margin-top:1px; }

/* ============ FLASHCARD ============ */
.flashcard { position:relative; width:100%; min-height:280px; cursor:pointer; perspective:1400px; }
.fc-face {
  position:absolute; inset:0; border-radius:var(--radius-lg); border:1px solid var(--border);
  background:var(--bg-card); display:flex; flex-direction:column; align-items:center; justify-content:center;
  padding:28px 24px; text-align:center; backface-visibility:hidden; -webkit-backface-visibility:hidden;
  transition:transform 0.5s cubic-bezier(0.4,0.2,0.2,1); box-shadow:var(--shadow-sm);
}
.fc-front { transform:rotateY(0deg); }
.fc-back { transform:rotateY(180deg); background:var(--bg-elevated); }
.flashcard.flipped .fc-front { transform:rotateY(-180deg); }
.flashcard.flipped .fc-back { transform:rotateY(0deg); }
.fc-word { font-family:var(--serif); font-size:38px; font-weight:600; letter-spacing:-0.02em; line-height:1.15; }
.fc-es-front { color:var(--text); }
.fc-art { color:var(--red); font-size:0.7em; font-family:var(--sans); font-weight:600; }
.fc-ipa { font-family:var(--mono); font-size:15px; color:var(--text-muted); margin-top:8px; }
.fc-hint { font-size:13px; color:var(--text-dim); margin-top:10px; }
.fc-answer { font-family:var(--serif); font-size:30px; font-weight:600; letter-spacing:-0.01em; line-height:1.2; }
.fc-ex { font-size:13px; color:var(--text-muted); font-style:italic; margin-top:14px; padding:10px 14px; background:var(--bg); border-radius:10px; border-left:2px solid var(--red); max-width:90%; }
.fc-ex span { display:block; font-style:normal; color:var(--text-dim); font-size:12px; margin-top:3px; }
.fc-tap { position:absolute; bottom:16px; font-size:11px; color:var(--text-dim); letter-spacing:0.03em; }
.fc-newbadge { position:absolute; top:14px; left:14px; font-size:10px; font-weight:600; text-transform:uppercase; letter-spacing:0.05em; color:var(--green); background:var(--green-soft); padding:3px 9px; border-radius:20px; }
.fc-audio { position:absolute; top:12px; right:12px; width:40px; height:40px; border-radius:11px; border:1px solid var(--border); background:var(--bg); color:var(--text); font-size:17px; cursor:pointer; display:grid; place-items:center; transition:all 0.15s; }
.fc-audio:hover { background:var(--hover); border-color:var(--red); transform:scale(1.05); }

/* grade buttons */
.fc-grade { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; margin-top:20px; }
.grade-btn { display:flex; flex-direction:column; align-items:center; gap:3px; padding:13px 4px; border-radius:12px; border:1px solid var(--border-strong); background:var(--bg-card); color:var(--text); font-family:inherit; font-size:13.5px; font-weight:600; cursor:pointer; transition:all 0.14s; }
.grade-btn small { font-size:10px; font-weight:400; color:var(--text-dim); }
.grade-btn:active { transform:scale(0.96); }
.g-again:hover { border-color:var(--danger); background:var(--danger-soft); color:var(--danger); }
.g-hard:hover { border-color:var(--ochre); background:var(--ochre-soft); color:var(--ochre); }
.g-good:hover { border-color:var(--cobalt); background:var(--cobalt-soft); color:var(--cobalt); }
.g-easy:hover { border-color:var(--green); background:var(--green-soft); color:var(--green); }
@media (max-width:420px){ .grade-btn { font-size:12.5px; padding:11px 2px; } .grade-btn small { font-size:9px; } }
</style>
</head>

/* ============================================================
   SRS ENGINE (SM-2) — Fase 1
   ============================================================ */
function srsOf(w){
  const id = wordId(w);
  return state.srs[id] || null;
}
function wordStatus(w){
  const s = srsOf(w);
  if(!s) return 'new';
  if(s.interval >= 21) return 'mastered';
  return 'learning';
}
function ensureNewCounter(){
  const t = todayStr();
  if(state.newTodayDate !== t){ state.newTodayDate = t; state.newToday = 0; }
}
/* El mazo del día: vencidas + nuevas hasta el tope diario */
function todayDeck(){
  ensureNewCounter();
  const t = todayStr();
  const all = getAllVocab();
  const due = [];         // ya vistas y vencidas
  const fresh = [];       // nunca estudiadas
  all.forEach(w=>{
    const s = srsOf(w);
    if(!s){ fresh.push(w); }
    else if(s.due <= t){ due.push(w); }
  });
  // ordena vencidas por fecha (más atrasadas primero)
  due.sort((a,b)=> (srsOf(a).due < srsOf(b).due ? -1 : 1));
  const room = Math.max(0, state.settings.newPerDay - state.newToday);
  const newSlice = fresh.slice(0, room);
  return { due, newCards: newSlice, all: [...due, ...newSlice] };
}
function deckCounts(){
  const d = todayDeck();
  const all = getAllVocab();
  let mastered=0, learning=0, fresh=0;
  all.forEach(w=>{ const st=wordStatus(w); if(st==='mastered')mastered++; else if(st==='learning')learning++; else fresh++; });
  return { due:d.due.length, newAvail:d.newCards.length, total:d.all.length, mastered, learning, fresh };
}
/* SM-2: quality 0..5. Devuelve el nuevo estado y lo guarda. */
function schedule(w, quality){
  const id = wordId(w);
  let s = state.srs[id] || { ef:2.5, interval:0, reps:0, due:todayStr(), dir:'de-es' };
  if(quality < 3){
    s.reps = 0; s.interval = 1;
  } else {
    if(s.reps === 0) s.interval = 1;
    else if(s.reps === 1) s.interval = 6;
    else s.interval = Math.round(s.interval * s.ef);
    s.reps += 1;
  }
  s.ef = s.ef + (0.1 - (5 - quality) * (0.08 + (5 - quality) * 0.02));
  if(s.ef < 1.3) s.ef = 1.3;
  const d = new Date(); d.setDate(d.getDate() + s.interval);
  s.due = d.toISOString().slice(0,10);
  state.srs[id] = s;
  return s;
}
function pickDir(){
  const setting = state.settings.dir;
  if(setting === 'de-es') return 'de-es';
  if(setting === 'es-de') return 'es-de';
  return Math.random() < 0.5 ? 'de-es' : 'es-de';  // mixed
}
function humanInterval(days){
  if(days <= 0) return 'hoy';
  if(days === 1) return 'mañana';
  if(days < 30) return `en ${days} días`;
  if(days < 60) return 'en 1 mes';
  return `en ${Math.round(days/30)} meses`;
}

/* ============================================================
   AUDIO — Web Speech API (de-DE), gratis y offline
   ============================================================ */
let _deVoice = null;
function initVoices(){
  if(!('speechSynthesis' in window)) return;
  const pick = ()=>{
    const vs = speechSynthesis.getVoices();
    _deVoice = vs.find(v=>v.lang==='de-DE') || vs.find(v=>v.lang && v.lang.startsWith('de')) || null;
  };
  pick();
  speechSynthesis.onvoiceschanged = pick;
}
function speak(text){
  if(!('speechSynthesis' in window)){ toast('Tu navegador no soporta audio'); return; }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'de-DE';
  if(_deVoice) u.voice = _deVoice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
/* limpia la palabra para pronunciar (quita artículos dobles, barras) */
function sayable(w){
  let t = w.de.split('/')[0].trim();     // "Lehrer / Lehrerin" → "Lehrer"
  t = t.replace(/\?$/,'');
  return (w.article ? w.article + ' ' : '') + t;
}

function startStudy(){
  const deck = todayDeck();
  if(deck.all.length===0){ toast('No hay nada que repasar'); return; }
  // marca cuántas nuevas entran para el contador diario
  study = {
    cards: deck.all.map(w=>({ w, isNew: !srsOf(w), dir: pickDir() })),
    idx: 0, flipped: false, correct: 0, reviewed: 0, newSeen: 0,
  };
  // barajar levemente manteniendo vencidas primero ya está ok
  currentView = 'study'; renderNav();
  renderStudyCard();
}

/* helper para el audio inline */
function sayableById(i){ return sayable(study.cards[i].w); }

/* muestra cuándo volverá la palabra según la nota */
function gradePreview(w, q){
  const id = wordId(w);
  const s = state.srs[id] || { ef:2.5, interval:0, reps:0 };
  let interval;
  if(q < 3) interval = 1;
  else {
    if(s.reps === 0) interval = 1;
    else if(s.reps === 1) interval = 6;
    else interval = Math.round(s.interval * s.ef);
  }
  return humanInterval(interval);
}

function flipCard(){
  study.flipped = !study.flipped;
  renderStudyCard();
  // al girar a la respuesta, pronuncia si es alemán
  const card = study.cards[study.idx];
  if(study.flipped){
    setTimeout(()=>{ try{ speak(sayable(card.w)); }catch(e){} }, 180);
  }
}

function gradeCard(q){
  const card = study.cards[study.idx];
  schedule(card.w, q);
  study.reviewed++;
  if(q >= 3) study.correct++;
  if(card.isNew){ study.newSeen++; }
  study.idx++;
  study.flipped = false;
  saveState();
  renderStudyCard();
}

function quitStudy(){
  if(confirm('¿Salir del repaso? Se guarda lo que ya calificaste.')){
    commitStudySession();
    go('study');
  }
}

function commitStudySession(){
  // actualiza contador de nuevas y racha
  ensureNewCounter();
  state.newToday += (study?.newSeen || 0);
  const t = todayStr();
  if(state.lastStudy !== t){
    if(state.lastStudy){
      const gap = daysBetween(state.lastStudy, t);
      if(gap === 1) state.streak = (state.streak||0) + 1;
      else if(gap > 1) state.streak = 1;
    } else {
      state.streak = (state.streak||0) + 1;
    }
    state.lastStudy = t;
  }
  saveState();
}

function finishStudy(){
  commitStudySession();
  const acc = study.reviewed ? Math.round(study.correct/study.reviewed*100) : 0;
  const V = $('views');
  V.innerHTML = `
    <div class="card" style="text-align:center;padding:34px 22px">
      <div style="font-size:52px;margin-bottom:12px">${acc>=80?'🏆':acc>=60?'🎉':'💪'}</div>
      <h2 style="margin-bottom:4px">¡Sesión completa!</h2>
      <div style="font-family:var(--serif);font-size:34px;font-weight:600;color:var(--red);margin:12px 0">${study.reviewed} ${study.reviewed===1?'palabra':'palabras'}</div>

}

function startQuiz(mode){
  let qs = [];
  if(mode==='all') qs = [...QUIZZES.day1, ...QUIZZES.day2, ...QUIZZES.day3];
  else if(mode==='vocab'){
    const pool = getAllVocab().filter(v=>v.de && v.es && !v.de.includes('/'));
    if(pool.length<4){ toast('Necesitas más vocabulario'); return; }
    const shuffled = [...pool].sort(()=>Math.random()-0.5).slice(0,6);
    qs = shuffled.map(w=>{
      const wrong = pool.filter(x=>x.de!==w.de).sort(()=>Math.random()-0.5).slice(0,3).map(x=>x.de);
      const opts = [w.de, ...wrong].sort(()=>Math.random()-0.5);
      return { q:`¿Cómo se dice <strong>„${w.es}"</strong>?`, opts, correct:opts.indexOf(w.de), exp:`„${w.de}" = ${w.es}` };
    });
  } else qs = QUIZZES[mode] || [];
  if(!qs.length){ toast('Sin preguntas'); return; }

  quiz = qs.sort(()=>Math.random()-0.5); qIdx=0; qScore=0;
  currentView='quiz'; renderNav();
  renderQuizQuestion();
}

function renderQuizQuestion(){
  const q = quiz[qIdx]; qAnswered=false;
  $('quizArea').innerHTML = `
    <div class="quiz-counter">Pregunta ${qIdx+1} / ${quiz.length}</div>
    <div class="quiz-progress">
      ${quiz.map((_,i)=>`<div class="qp-bar"><div class="qp-fill" style="width:${i<qIdx?'100':i===qIdx?'0':'0'}%"></div></div>`).join('')}
    </div>
    <div class="quiz-q">${q.q}</div>
    <div id="quizOpts">
      ${q.opts.map((o,i)=>`<button class="quiz-opt" onclick="answerQuiz(${i})">${o}</button>`).join('')}
    </div>
    <div class="quiz-fb" id="quizFb"></div>
    <div style="display:flex;gap:9px;margin-top:16px">
      <button class="btn" onclick="quitQuiz()">Salir</button>
      <button class="btn btn-primary" id="qNext" style="display:none;margin-left:auto" onclick="nextQuiz()">Siguiente →</button>
    </div>`;
  requestAnimationFrame(()=>{ const f=document.querySelector('.qp-fill'); });
  // animate current bar
  setTimeout(()=>{ const bars=document.querySelectorAll('.qp-fill'); if(bars[qIdx]) bars[qIdx].style.width='40%'; }, 50);
}

function answerQuiz(i){
  if(qAnswered) return; qAnswered=true;
  const q = quiz[qIdx];
  const opts = document.querySelectorAll('.quiz-opt');
  opts.forEach((o,idx)=>{
    o.disabled = true;
    if(idx===q.correct){ o.classList.add('correct'); o.innerHTML += '<span class="mark">✓</span>'; }
    if(idx===i && i!==q.correct){ o.classList.add('wrong'); o.innerHTML += '<span class="mark">✗</span>'; }
  });
  const fb = $('quizFb');
  if(i===q.correct){ qScore++; fb.className='quiz-fb correct show'; fb.innerHTML=`<strong>¡Richtig! 🎉</strong>${q.exp}`; }
  else { fb.className='quiz-fb wrong show'; fb.innerHTML=`<strong>Casi…</strong>${q.exp}`; }
  const bars=document.querySelectorAll('.qp-fill'); if(bars[qIdx]) bars[qIdx].style.width='100%';
  const nb=$('qNext'); nb.style.display='block'; nb.textContent = qIdx===quiz.length-1?'Ver resultado →':'Siguiente →';
}
function nextQuiz(){
  qIdx++;
  if(qIdx>=quiz.length) showResult();
  else renderQuizQuestion();
}
function quitQuiz(){ if(confirm('¿Salir del quiz?')) go('quiz'); }

function showResult(){
  const pct = Math.round(qScore/quiz.length*100);
  let emoji, msg;
  if(pct===100){ emoji='🏆'; msg='¡Perfecto! Dominas este tema.'; }
  else if(pct>=80){ emoji='🎉'; msg='¡Muy bien! Casi impecable.'; }
  else if(pct>=60){ emoji='💪'; msg='Buen trabajo. Un repaso más y lo tienes.'; }
  else { emoji='📚'; msg='Repasa la sesión y vuelve a intentarlo.'; }
  if(pct>=80 && qScore>0){ /* keep streak vibe */ }
  $('quizArea').innerHTML = `
    <div class="card" style="text-align:center;padding:32px 22px">
      <div class="result-emoji">${emoji}</div>
      <h2 style="margin-bottom:4px">${qScore===quiz.length?'¡Sin fallos!':'¡Terminaste!'}</h2>
      <div class="result-score">${qScore}/${quiz.length}</div>
      <p style="color:var(--text-muted);margin-bottom:24px">${msg}</p>
      <div style="display:flex;gap:9px">
        <button class="btn btn-full" onclick="go('quiz')">Otro quiz</button>
        <button class="btn btn-primary btn-full" onclick="go('home')">Inicio</button>
      </div>
    </div>`;
}

    <div style="display:flex;flex-direction:column;gap:9px">
      <button class="resource-btn" onclick="exportData()"><span class="r-icon">💾</span>Exportar mi vocabulario (respaldo)<span class="r-arrow">↓</span></button>
      <button class="resource-btn" onclick="importData()"><span class="r-icon">📥</span>Importar respaldo<span class="r-arrow">↑</span></button>
    </div>`;
}
function conjugate(){
  const v = $('verbDict').value.trim();
  if(!v){ toast('Escribe un verbo'); return; }
  window.open(`https://www.verbformen.com/?w=${encodeURIComponent(v)}`,'_blank','noopener');
}
function openURL(u){ window.open(u,'_blank','noopener'); }

/* ---------- EXPORT / IMPORT ---------- */
function exportData(){
  const data = JSON.stringify({ personalVocab: state.personalVocab, completed: state.completed, exportedAt: new Date().toISOString() }, null, 2);
  const blob = new Blob([data], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'deutsch-hub-respaldo.json'; a.click();
  URL.revokeObjectURL(url);
  toast('💾 Respaldo descargado');
}
function importData(){
  const inp = document.createElement('input');
  inp.type='file'; inp.accept='.json';
  inp.onchange = e=>{
    const file = e.target.files[0]; if(!file) return;
    const r = new FileReader();
    r.onload = ()=>{
      try {
        const d = JSON.parse(r.result);
        if(Array.isArray(d.personalVocab)){
          state.personalVocab = d.personalVocab; saveState();
          toast('✓ Respaldo importado'); go(currentView);
        } else toast('Archivo no válido');
      } catch(err){ toast('Error al leer el archivo'); }
    };
    r.readAsText(file);
  };
  inp.click();
}

/* ---------- INIT ---------- */
function init(){
  loadState();
  applyTheme();
  initVoices();
  go('home');
}
init();

</script>
</body>
</html>
